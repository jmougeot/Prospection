# Déploiement sur le CX33 partagé avec la stack "ruby".
# On NE lance PAS le Caddy bundlé (le ruby-caddy existant détient déjà 80/443).
# L'app rejoint le réseau "ruby_default" pour que ruby-caddy l'atteigne par son nom.
#
#   docker compose -f docker-compose.server.yml up -d --build
#
services:
  app:
    build: .
    container_name: sequence-app
    restart: unless-stopped
    env_file: .env
    environment:
      - DATA_DIR=/data
      - PORT=3000
    volumes:
      - sequence-data:/data   # base SQLite persistée
    networks:
      - ruby_default
    expose:
      - "3000"                # joignable seulement par ruby-caddy, pas publié

  # Serveur MCP en HTTP : expose les tools sequence-mail à l'agent Ruby distant.
  # Parle à l'app par le réseau interne (pas de Cloudflare/Basic Auth backend).
  # L'auth de l'endpoint est faite par ruby-caddy (route /mcp de go.rubysignal.com).
  mcp:
    build: ./mcp
    container_name: sequence-mcp
    restart: unless-stopped
    environment:
      - MCP_HTTP_PORT=8790
      - SEQUENCE_MAIL_BASE_URL=http://sequence-app:3000
      # Adresse publique pour les liens rendus à l'utilisateur (connexion Google, extension)
      - SEQUENCE_MAIL_PUBLIC_URL=https://go.rubysignal.com
    networks:
      - ruby_default
    expose:
      - "8790"                # joignable seulement par ruby-caddy
    depends_on:
      - app

  # Navigateurs serveur des comptes LinkedIn en mode « serveur » (un Chromium par
  # compte, derrière son proxy). Parle à l'app par le réseau interne avec le
  # secret LI_RUNNER_SECRET (même .env que l'app). Profils persistés (cookies).
  li-runner:
    build:
      context: .
      dockerfile: runner/Dockerfile
    container_name: sequence-li-runner
    restart: unless-stopped
    env_file: .env
    environment:
      - SEQUENCE_URL=http://sequence-app:3000
      - PROFILES_DIR=/data/profiles
    volumes:
      - li-profiles:/data/profiles
    networks:
      - ruby_default
    shm_size: "1gb"           # Chromium a besoin d'un /dev/shm confortable
    mem_limit: 3g             # plafond : ~5 comptes simultanés sans affamer le VPS
    depends_on:
      - app

volumes:
  sequence-data:
  li-profiles:

networks:
  ruby_default:
    external: true            # réseau créé par la stack ruby existante
